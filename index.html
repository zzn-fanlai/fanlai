<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>饭来 · 两个人的吃饭小本子</title>
<meta name="description" content="饭来：两个人的做饭、外食、外卖决策与执行工具。" />
<meta name="theme-color" content="#FFF9F2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="饭来" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
<link rel="icon" href="./assets/icons/icon-192.png" />
<link rel="stylesheet" href="./css/tokens.css" />
<link rel="stylesheet" href="./css/app.css" />

<!-- 开启界面的样式直接内联：即使 app.css 是旧缓存，启动页也不会破版 -->
<style>
  #splash {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 50% 16%, rgba(244, 194, 194, .38), transparent 55%),
      radial-gradient(circle at 84% 88%, rgba(242, 183, 5, .16), transparent 46%),
      #fff9f2;
    transition: opacity 420ms ease, visibility 420ms;
  }
  #splash.hide { opacity: 0; visibility: hidden; }
  #splash .splash-inner { text-align: center; width: 100%; max-width: 360px; }
  #splash .splash-art {
    display: block;
    width: min(76vw, 300px);
    aspect-ratio: 3 / 4;
    object-fit: cover;
    margin: 0 auto 20px;
    border-radius: 26px;
    border: 4px solid #fff;
    box-shadow: 0 10px 34px rgba(61, 43, 31, .18), 0 2px 0 rgba(61, 43, 31, .08);
  }
  #splash .splash-fallback { display: none; margin-bottom: 14px; }
  #splash .splash-logo { font-size: 76px; line-height: 1.1; }
  #splash .splash-name {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 8px;
    text-indent: 8px;
    color: #3d2b1f;
  }
  #splash .splash-tip { margin-top: 6px; font-size: 13px; color: #8a7566; }
  #splash .splash-dots { display: flex; gap: 7px; justify-content: center; margin-top: 20px; }
  #splash .splash-dots i {
    width: 7px; height: 7px; border-radius: 50%;
    background: #e4572e;
    opacity: .25;
    animation: splashDot 1.15s infinite;
  }
  #splash .splash-dots i:nth-child(2) { animation-delay: .16s; }
  #splash .splash-dots i:nth-child(3) { animation-delay: .32s; }
  @keyframes splashDot {
    0%, 100% { opacity: .22; transform: scale(.82); }
    50% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-inner">
      <!-- 有 assets/splash.jpg 就显示这张图，没有就退回下面那个 emoji 封面 -->
      <img class="splash-art" id="splash-art" src="./assets/splash.jpg" alt="" />
      <div class="splash-fallback" id="splash-fallback">
        <div class="splash-logo">🍚</div>
      </div>
      <div class="splash-name">饭来</div>
      <div class="splash-tip">两个人的吃饭小本子</div>
      <div class="splash-dots"><i></i><i></i><i></i></div>
    </div>
  </div>

  <div id="app" class="app" aria-live="polite"></div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-mask" data-act="sheet-close"></div>
    <div class="sheet-body" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div id="sheet-content"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <noscript>
    <div style="padding:24px;font-family:sans-serif">饭来需要开启 JavaScript 才能使用。</div>
  </noscript>

  <script src="./js/demo.js"></script>
  <script>
    (function () {
      var splash = document.getElementById("splash");
      var art = document.getElementById("splash-art");
      var fb = document.getElementById("splash-fallback");
      var shownAt = Date.now();
      var gone = false;

      // 启动图 404 时退回 emoji 封面
      function fallback() {
        if (art) art.style.display = "none";
        if (fb) fb.style.display = "block";
      }
      if (art) {
        art.addEventListener("error", fallback);
        if (art.complete && art.naturalWidth === 0) fallback();
      } else {
        fallback();
      }

      // 全局淡出入口：app.js 会调用它（最少停留 900ms）
      // 即使 app.js 是旧缓存、根本没调用，下面的兜底计时器也会把启动页收掉
      window.__fanlaiHideSplash = function () {
        if (gone || !splash) return;
        gone = true;
        var wait = Math.max(0, 900 - (Date.now() - shownAt));
        setTimeout(function () {
          splash.classList.add("hide");
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 520);
        }, wait);
      };

      // 兜底：6 秒还没人收，就自己收掉，绝不把用户堵在启动页
      setTimeout(function () {
        window.__fanlaiHideSplash();
      }, 6000);
    })();
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
