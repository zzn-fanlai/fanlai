<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>饭来 · 两个人的吃饭小本子</title>
<meta name="description" content="饭来：两个人的做饭、外食、外卖决策与执行工具。" />
<meta name="theme-color" content="#FFF9F2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="饭来" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
<link rel="icon" href="./assets/icons/icon-192.png" />
<link rel="stylesheet" href="./css/tokens.css" />
<link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-inner">
      <!-- 有 assets/splash.jpg 就显示这张图，没有就退回下面那个 emoji 封面 -->
      <img class="splash-art" id="splash-art" src="./assets/splash.jpg" alt="" />
      <div class="splash-fallback" id="splash-fallback">
        <div class="splash-logo">🍚</div>
      </div>
      <div class="splash-name">饭来</div>
      <div class="splash-tip">两个人的吃饭小本子</div>
      <div class="splash-dots"><i></i><i></i><i></i></div>
    </div>
  </div>

  <div id="app" class="app" aria-live="polite"></div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-mask" data-act="sheet-close"></div>
    <div class="sheet-body" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div id="sheet-content"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <noscript>
    <div style="padding:24px;font-family:sans-serif">饭来需要开启 JavaScript 才能使用。</div>
  </noscript>

  <script src="./js/demo.js"></script>
  <script>
    // 开启界面：启动图存在就显示，不存在自动退回 emoji 封面
    (function () {
      var art = document.getElementById("splash-art");
      var fb = document.getElementById("splash-fallback");
      function fallback() {
        if (art) art.style.display = "none";
        if (fb) fb.style.display = "block";
      }
      if (art) {
        art.addEventListener("error", fallback);
        if (art.complete && art.naturalWidth === 0) fallback();
      } else {
        fallback();
      }
    })();
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
